name: 🎬 Autonomous Daily Video Production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install System Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📦 Installing FFmpeg..."
          echo "=========================================="
          
          sudo apt-get install -y ffmpeg
          echo "✅ FFmpeg installed"
          echo ""
      
      - name: 📚 Install Python Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📚 Installing Python packages..."
          echo "=========================================="
          
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy pillow requests beautifulsoup4 feedparser
          pip install imageio==2.31.3 imageio-ffmpeg==0.4.9
          pip install moviepy==1.0.3 pydub ffmpeg-python
          pip install edge-tts gTTS schedule pandas python-dotenv requests-oauthlib
          
          echo ""
          echo "✅ All packages installed"
          echo ""
      
      - name: 📁 Create Output Directories
        run: |
          mkdir -p output/{images,audio,videos,thumbnails,visuals,voiceovers,music_sfx}
          echo "✅ Directories created"
      
      - name: 📈 Step 1 - Trend Research
        run: python scripts/1_trend_research.py || true
      
      - name: ✍️ Step 2 - Script Generation
        run: python scripts/2_script_generation.py || true
      
      - name: 🎨 Step 3 - Visual Generation
        run: python scripts/3_visual_generation.py || true
      
      - name: 🎙️ Step 4 - Voiceover Generation
        run: python scripts/4_voiceover.py || true
      
      - name: 🎵 Step 5 - Music & Sound Effects
        run: python scripts/5_music_sfx.py || true
      
      - name: 🔍 DEBUG - Video Creation Check
        run: |
          echo ""
          echo "=========================================="
          echo "🔍 DEBUG: VIDEO CREATION VERIFICATION"
          echo "=========================================="
          
          echo ""
          echo "1️⃣ CHECKING OUTPUT FOLDERS:"
          echo "=================================="
          
          for folder in output output/visuals output/voiceovers output/music_sfx output/videos; do
            if [ -d "$folder" ]; then
              count=$(find "$folder" -type f 2>/dev/null | wc -l)
              echo "   ✅ $folder ($count files)"
            else
              echo "   ❌ $folder NOT FOUND"
            fi
          done
          
          echo ""
          echo "2️⃣ CHECKING MANIFEST FILES:"
          echo "=================================="
          
          for manifest in output/scripts.json output/visuals_manifest.json output/voiceover_manifest.json; do
            if [ -f "$manifest" ]; then
              echo "   ✅ $manifest"
            else
              echo "   ❌ $manifest NOT FOUND"
            fi
          done
          
          echo ""
          echo "3️⃣ ALL FILES IN OUTPUT:"
          echo "=================================="
          find output/ -type f -exec ls -lh {} \; 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}' | head -30
          
          echo ""
          echo "4️⃣ CHECKING FFMPEG:"
          echo "=================================="
          if command -v ffmpeg &> /dev/null; then
            ffmpeg -version | head -1 | awk '{print "   ✅ " $0}'
          else
            echo "   ❌ FFmpeg not found"
          fi
          
          echo ""
          echo "5️⃣ TEST VIDEO CREATION:"
          echo "=================================="
          
          test_video="output/videos/test_creation.mp4"
          
          if ffmpeg -f lavfi -i color=c=blue:s=320x240:d=2 -pix_fmt yuv420p "$test_video" -y 2>/dev/null; then
            if [ -f "$test_video" ]; then
              size=$(du -h "$test_video" | cut -f1)
              echo "   ✅ Test video created: $size"
              rm "$test_video"
            else
              echo "   ❌ Test video file not created"
            fi
          else
            echo "   ❌ FFmpeg test failed"
          fi
          
          echo ""
          echo "6️⃣ GIT STATUS:"
          echo "=================================="
          git status --short | head -20
          
          echo ""
          echo "7️⃣ VIDEO FILES IN GIT:"
          echo "=================================="
          git ls-files output/videos/*.mp4 2>/dev/null | wc -l | awk '{print "   Tracked MP4 files: " $1}'
          
          echo ""
          echo "=========================================="
          echo "✅ DEBUG COMPLETE"
          echo "=========================================="
          echo ""
      
      - name: 🎬 Step 6 - Video Editing
        run: python scripts/6_video_editing.py || true
      
      - name: 📹 Check Videos Created
        run: |
          echo ""
          echo "=========================================="
          echo "📹 CHECKING VIDEO OUTPUT"
          echo "=========================================="
          
          echo ""
          echo "Videos in output/videos/:"
          ls -lh output/videos/*.mp4 2>/dev/null || echo "   No MP4 files found"
          
          echo ""
          echo "Total size:"
          du -sh output/videos/ 2>/dev/null || echo "   Folder empty"
          
          echo ""
      
      - name: 🖼️ Step 7 - Thumbnail Generation
        run: python scripts/7_thumbnail.py || true
      
      - name: 🔍 Step 8 - SEO Optimization
        run: python scripts/8_seo_optimization.py || true
      
      - name: 📤 Step 9 - YouTube Upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "⚠️ YouTube not configured"
          else
            python scripts/9_youtube_upload.py || true
          fi
      
      - name: 📊 Step 10 - Analytics
        run: python scripts/10_analytics.py || true
      
      - name: 📝 Commit & Push All Files
        run: |
          echo ""
          echo "=========================================="
          echo "📝 COMMITTING TO GITHUB"
          echo "=========================================="
          
          git config --local user.email "bot@youtube.local"
          git config --local user.name "🤖 AI Video Bot"
          
          echo ""
          echo "Staging files..."
          git add . -f
          
          echo ""
          echo "Files ready to commit:"
          git status --short | wc -l | awk '{print "   Total: " $1 " changes"}'
          
          echo ""
          echo "Committing..."
          git commit -m "🎬 Daily video production - $(date +'%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"
          
          echo ""
          echo "Pushing..."
          git push origin main 2>/dev/null || git push origin master 2>/dev/null || echo "Push completed"
          
          echo ""
          echo "✅ All files saved"
          echo ""
      
      - name: ✅ Final Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                                                        ║"
          echo "║  ✅ WORKFLOW COMPLETE                                  ║"
          echo "║                                                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📹 VIDEO SUMMARY:"
          video_count=$(find output/videos -name "*.mp4" 2>/dev/null | wc -l)
          echo "   MP4 files created: $video_count"
          
          if [ $video_count -gt 0 ]; then
            echo "   Location: output/videos/"
            ls -lh output/videos/*.mp4 2>/dev/null | awk '{print "      " $9 " (" $5 ")"}'
          else
            echo "   ⚠️ No videos created yet"
          fi
          
          echo ""
          echo "⏰ SCHEDULE: Daily at 2:00 AM UTC"
          echo ""
