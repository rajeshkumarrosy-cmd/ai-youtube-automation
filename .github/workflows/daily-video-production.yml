name: 🎬 Autonomous Daily Video Production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get install -y ffmpeg
          echo "✅ FFmpeg installed"
      
      - name: 📚 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Python packages installed"
      
      - name: 📁 Create Output Directories
        run: |
          mkdir -p output/{images,audio,videos,thumbnails,visuals,voiceovers,music_sfx}
          echo "✅ Directories created"
      
      - name: 📈 Step 1 - Trend Research
        run: python scripts/1_trend_research.py || true
      
      - name: ✍️ Step 2 - Script Generation
        run: python scripts/2_script_generation.py || true
      
      - name: 🎨 Step 3 - Visual Generation
        run: python scripts/3_visual_generation.py || true
      
      - name: 🎙️ Step 4 - Voiceover Generation
        run: python scripts/4_voiceover.py || true
      
      - name: 🎵 Step 5 - Music & Sound Effects
        run: python scripts/5_music_sfx.py || true
      
      - name: 🎬 Step 6 - Video Editing
        run: python scripts/6_video_editing.py || true
      
      - name: 🖼️ Step 7 - Thumbnail Generation
        run: python scripts/7_thumbnail.py || true
      
      - name: 🔍 Step 8 - SEO Optimization
        run: python scripts/8_seo_optimization.py || true
      
      - name: 📤 Step 9 - YouTube Upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "⚠️ YouTube not configured"
          else
            python scripts/9_youtube_upload.py || true
          fi
      
      - name: 📊 Step 10 - Analytics
        run: python scripts/10_analytics.py || true
      
      - name: 📝 Commit & Push Videos
        run: |
          echo ""
          echo "=========================================="
          echo "📝 SAVING VIDEOS TO GITHUB"
          echo "=========================================="
          
          git config --local user.email "bot@youtube.local"
          git config --local user.name "AI Video Bot"
          
          # Add all output files (especially videos)
          git add output/ -f
          git add .gitattributes 2>/dev/null || true
          
          # Show what we're adding
          echo ""
          echo "Files ready to commit:"
          git status --short
          
          # Commit
          git commit -m "🎬 Daily video production - $(date +'%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"
          
          # Push
          echo ""
          echo "Pushing to GitHub..."
          git push origin main || git push origin master || echo "Push failed"
          
          echo ""
          echo "✅ Complete!"
          echo ""
      
      - name: ✅ Workflow Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║   ✅ PRODUCTION COMPLETE!              ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📹 Output videos:"
          ls -lh output/videos/*.mp4 2>/dev/null || echo "No MP4s found"
          echo ""
          echo "📊 All files:"
          find output/ -type f | wc -l | xargs echo "Total files:"
          echo ""
