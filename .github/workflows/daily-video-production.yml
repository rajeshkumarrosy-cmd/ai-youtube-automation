name: 🎬 Autonomous Daily Video Production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # ============================================
      # INSTALL DEPENDENCIES (OPTIMIZED)
      # ============================================
      - name: 📦 Install System Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📦 Installing FFmpeg..."
          echo "=========================================="
          
          # Quick install without update
          sudo apt-get install -y ffmpeg 2>&1 | head -5
          
          echo ""
          echo "Verifying FFmpeg..."
          ffmpeg -version | head -1
          echo "✅ FFmpeg ready"
          echo ""
      
      - name: 📚 Install Python Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📚 Installing Python packages..."
          echo "=========================================="
          
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          echo ""
          echo "✅ All packages installed"
          echo ""
      
      - name: 📁 Create Output Directories
        run: |
          mkdir -p output/{images,audio,videos,thumbnails,visuals,voiceovers,music_sfx}
          echo "✅ Output directories created"
      
      # ============================================
      # MAIN PRODUCTION STEPS
      # ============================================
      - name: 📈 Step 1 - Trend Research
        run: python scripts/1_trend_research.py || true
      
      - name: ✍️ Step 2 - Script Generation
        run: python scripts/2_script_generation.py || true
      
      - name: 🎨 Step 3 - Visual Generation
        run: python scripts/3_visual_generation.py || true
      
      - name: 🎙️ Step 4 - Voiceover Generation
        run: python scripts/4_voiceover.py || true
      
      - name: 🎵 Step 5 - Music & Sound Effects
        run: python scripts/5_music_sfx.py || true
      
      - name: 🔍 Debug - Check Assets
        run: |
          echo "Checking output files..."
          ls -lah output/ 2>/dev/null || echo "Output folder empty"
      
      - name: 🎬 Step 6 - Video Editing
        run: python scripts/6_video_editing.py || true
      
      - name: 🖼️ Step 7 - Thumbnail Generation
        run: python scripts/7_thumbnail.py || true
      
      - name: 🔍 Step 8 - SEO Optimization
        run: python scripts/8_seo_optimization.py || true
      
      - name: 📤 Step 9 - YouTube Upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "⚠️ YouTube credentials not configured"
          else
            python scripts/9_youtube_upload.py || true
          fi
      
      - name: 📊 Step 10 - Analytics
        run: python scripts/10_analytics.py || true
      
      # ============================================
      # COMMIT RESULTS
      # ============================================
      - name: 📝 Commit Results
        run: |
          git config --local user.email "bot@youtube.local"
          git config --local user.name "AI Bot"
          
          if ! git diff-index --quiet HEAD --; then
            git add -A
            git commit -m "🎬 Daily production - $(date +'%Y-%m-%d')" || true
            git push origin main || git push origin master || true
          fi
      
      # ============================================
      # FINAL SUMMARY
      # ============================================
      - name: ✅ Workflow Complete
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║   ✅ VIDEO PRODUCTION COMPLETE!        ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📹 Videos created:"
          ls -lh output/videos/*.mp4 2>/dev/null || echo "No videos yet"
          echo ""
          echo "🎬 Next run: Tomorrow at 2 AM UTC"
          echo ""
