name: 🎬 Autonomous Daily Video Production

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:     # Manual trigger option

jobs:
  video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      # ============================================
      # SETUP
      # ============================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # ============================================
      # INSTALL DEPENDENCIES
      # ============================================
      - name: 📦 Install System Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📦 Installing FFmpeg..."
          echo "=========================================="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "✅ FFmpeg installed"
          echo ""
      
      - name: 📚 Install Python Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📚 Installing Python packages..."
          echo "=========================================="
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo ""
          echo "Verifying installations..."
          python -c "import moviepy; print('✅ moviepy installed')"
          python -c "import pydub; print('✅ pydub installed')"
          python -c "import requests; print('✅ requests installed')"
          python -c "import PIL; print('✅ Pillow installed')"
          echo ""
          echo "✅ All packages installed successfully"
          echo ""
      
      # ============================================
      # CREATE OUTPUT DIRECTORIES
      # ============================================
      - name: 📁 Create Output Directories
        run: |
          echo ""
          echo "=========================================="
          echo "📁 Creating output directories..."
          echo "=========================================="
          mkdir -p output/{images,audio,videos,thumbnails,visuals,voiceovers,music_sfx}
          echo "✅ Output directories created"
          echo ""
      
      # ============================================
      # STEP 1: TREND RESEARCH
      # ============================================
      - name: 📈 Step 1 - Trend Research
        run: |
          echo ""
          echo "=========================================="
          echo "📈 STEP 1: TREND RESEARCH"
          echo "=========================================="
          python scripts/1_trend_research.py
          echo "✅ Trend research completed"
          echo ""
      
      # ============================================
      # STEP 2: SCRIPT GENERATION
      # ============================================
      - name: ✍️ Step 2 - Script Generation
        run: |
          echo ""
          echo "=========================================="
          echo "✍️ STEP 2: SCRIPT GENERATION"
          echo "=========================================="
          python scripts/2_script_generation.py
          echo "✅ Script generation completed"
          echo ""
      
      # ============================================
      # STEP 3: VISUAL GENERATION
      # ============================================
      - name: 🎨 Step 3 - Visual Generation
        run: |
          echo ""
          echo "=========================================="
          echo "🎨 STEP 3: VISUAL GENERATION"
          echo "=========================================="
          python scripts/3_visual_generation.py
          echo "✅ Visual generation completed"
          echo ""
      
      # ============================================
      # STEP 4: VOICEOVER GENERATION
      # ============================================
      - name: 🎙️ Step 4 - Voiceover Generation
        run: |
          echo ""
          echo "=========================================="
          echo "🎙️ STEP 4: VOICEOVER GENERATION"
          echo "=========================================="
          python scripts/4_voiceover.py
          echo "✅ Voiceover generation completed"
          echo ""
      
