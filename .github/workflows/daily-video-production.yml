name: 🎬 Autonomous Daily Video Production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install System Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📦 Installing FFmpeg..."
          echo "=========================================="
          
          sudo apt-get install -y ffmpeg
          echo "✅ FFmpeg installed"
          echo ""
      
      - name: 📚 Install Python Dependencies
        run: |
          echo ""
          echo "=========================================="
          echo "📚 Installing Python packages..."
          echo "=========================================="
          
          python -m pip install --upgrade pip setuptools wheel
          
          echo ""
          echo "Installing core packages..."
          pip install numpy pillow requests beautifulsoup4 feedparser
          
          echo ""
          echo "Installing image/video packages..."
          pip install imageio==2.31.3
          pip install imageio-ffmpeg==0.4.9
          
          echo ""
          echo "Installing moviepy..."
          pip install moviepy==1.0.3
          
          echo ""
          echo "Installing audio packages..."
          pip install pydub ffmpeg-python
          
          echo ""
          echo "Installing TTS packages..."
          pip install edge-tts gTTS
          
          echo ""
          echo "Installing utilities..."
          pip install schedule pandas python-dotenv requests-oauthlib
          
          echo ""
          echo "=========================================="
          echo "Verifying installations..."
          echo "=========================================="
          
          python -c "import numpy; print('✅ numpy')" || echo "❌ numpy failed"
          python -c "import PIL; print('✅ Pillow')" || echo "❌ Pillow failed"
          python -c "import requests; print('✅ requests')" || echo "❌ requests failed"
          python -c "import moviepy; print('✅ moviepy')" || echo "❌ moviepy failed"
          python -c "import imageio; print('✅ imageio')" || echo "❌ imageio failed"
          python -c "import pydub; print('✅ pydub')" || echo "❌ pydub failed"
          python -c "from moviepy.editor import *; print('✅ moviepy.editor')" || echo "⚠️ moviepy.editor (will use FFmpeg)"
          
          echo ""
          echo "✅ All packages installed"
          echo ""
      
      - name: 📁 Create Output Directories
        run: |
          echo ""
          echo "=========================================="
          echo "📁 Creating output directories..."
          echo "=========================================="
          
          mkdir -p output/{images,audio,videos,thumbnails,visuals,voiceovers,music_sfx}
          
          echo "✅ Directories created"
          echo ""
      
      - name: 📈 Step 1 - Trend Research
        run: |
          echo ""
          echo "=========================================="
          echo "📈 STEP 1: TREND RESEARCH"
          echo "=========================================="
          python scripts/1_trend_research.py || true
          echo ""
      
      - name: ✍️ Step 2 - Script Generation
        run: |
          echo ""
          echo "=========================================="
          echo "✍️ STEP 2: SCRIPT GENERATION"
          echo "=========================================="
          python scripts/2_script_generation.py || true
          echo ""
      
      - name: 🎨 Step 3 - Visual Generation
        run: |
          echo ""
          echo "=========================================="
          echo "🎨 STEP 3: VISUAL GENERATION"
          echo "=========================================="
          python scripts/3_visual_generation.py || true
          echo ""
      
      - name: 🎙️ Step 4 - Voiceover Generation
        run: |
          echo ""
          echo "=========================================="
          echo "🎙️ STEP 4: VOICEOVER GENERATION"
          echo "=========================================="
          python scripts/4_voiceover.py || true
          echo ""
      
      - name: 🎵 Step 5 - Music & Sound Effects
        run: |
          echo ""
          echo "=========================================="
          echo "🎵 STEP 5: MUSIC & SOUND EFFECTS"
          echo "=========================================="
          python scripts/5_music_sfx.py || true
          echo ""
      
      - name: 🔍 Debug - Check Assets
        run: |
          echo ""
          echo "=========================================="
          echo "🔍 CHECKING GENERATED ASSETS"
          echo "=========================================="
          
          echo "Visuals:"
          ls -lh output/visuals/ 2>/dev/null | head -5 || echo "No visuals"
          
          echo ""
          echo "Voiceovers:"
          ls -lh output/voiceovers/ 2>/dev/null | head -5 || echo "No voiceovers"
          
          echo ""
          echo "Music:"
          ls -lh output/music_sfx/ 2>/dev/null | head -5 || echo "No music"
          
          echo ""
      
      - name: 🎬 Step 6 - Video Editing
        run: |
          echo ""
          echo "=========================================="
          echo "🎬 STEP 6: VIDEO EDITING & ASSEMBLY"
          echo "=========================================="
          python scripts/6_video_editing.py || true
          echo ""
      
      - name: ✅ Verify Video Files
        run: |
          echo ""
          echo "=========================================="
          echo "✅ VERIFYING VIDEO OUTPUT"
          echo "=========================================="
          
          echo ""
          echo "Videos created:"
          ls -lh output/videos/*.mp4 2>/dev/null || echo "No MP4 files found"
          
          echo ""
          echo "Total files in output:"
          find output/ -type f | wc -l | xargs echo "Count:"
          
          echo ""
      
      - name: 🖼️ Step 7 - Thumbnail Generation
        run: |
          echo ""
          echo "=========================================="
          echo "🖼️ STEP 7: THUMBNAIL GENERATION"
          echo "=========================================="
          python scripts/7_thumbnail.py || true
          echo ""
      
      - name: 🔍 Step 8 - SEO Optimization
        run: |
          echo ""
          echo "=========================================="
          echo "🔍 STEP 8: SEO OPTIMIZATION"
          echo "=========================================="
          python scripts/8_seo_optimization.py || true
          echo ""
      
      - name: 📤 Step 9 - YouTube Upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          echo ""
          echo "=========================================="
          echo "📤 STEP 9: YOUTUBE UPLOAD"
          echo "=========================================="
          
          if [ -z "$YOUTUBE_API_KEY" ] || [ -z "$YOUTUBE_CHANNEL_ID" ]; then
            echo "⚠️ YouTube credentials not configured"
            echo "   Videos are ready but not uploaded"
            echo "   To enable auto-upload, add GitHub secrets:"
            echo "   - YOUTUBE_API_KEY"
            echo "   - YOUTUBE_CHANNEL_ID"
          else
            python scripts/9_youtube_upload.py || true
            echo "✅ YouTube upload completed"
          fi
          echo ""
      
      - name: 📊 Step 10 - Analytics
        run: |
          echo ""
          echo "=========================================="
          echo "📊 STEP 10: ANALYTICS & LEARNING"
          echo "=========================================="
          python scripts/10_analytics.py || true
          echo ""
      
      - name: 📝 Commit & Push Videos
        run: |
          echo ""
          echo "=========================================="
          echo "📝 SAVING VIDEOS TO GITHUB"
          echo "=========================================="
          
          git config --local user.email "bot@youtube.local"
          git config --local user.name "🤖 AI Video Bot"
          
          # Add all output files
          echo "Adding output files..."
          git add output/ -f
          git add .gitattributes 2>/dev/null || true
          
          # Check status
          echo ""
          echo "Files to commit:"
          git status --short | head -20
          
          # Count videos
          video_count=$(find output/videos/ -name "*.mp4" 2>/dev/null | wc -l)
          echo ""
          echo "Video files: $video_count"
          
          # Commit
          echo ""
          echo "Committing..."
          git commit -m "🎬 Daily video production - $(date +'%Y-%m-%d %H:%M:%S UTC') - $video_count videos" || echo "Nothing new to commit"
          
          # Push
          echo ""
          echo "Pushing to GitHub..."
          git push origin main 2>/dev/null || git push origin master 2>/dev/null || echo "Push completed"
          
          echo ""
          echo "✅ Videos saved to GitHub"
          echo ""
      
      - name: ✅ Workflow Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                                                        ║"
          echo "║     ✅ DAILY VIDEO PRODUCTION COMPLETE!                ║"
          echo "║                                                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 PRODUCTION SUMMARY:"
          echo "   ✅ Step 1:  Trend Research"
          echo "   ✅ Step 2:  Script Generation"
          echo "   ✅ Step 3:  Visual Generation"
          echo "   ✅ Step 4:  Voiceover Generation"
          echo "   ✅ Step 5:  Music & Sound Effects"
          echo "   ✅ Step 6:  Video Editing & Assembly"
          echo "   ✅ Step 7:  Thumbnail Generation"
          echo "   ✅ Step 8:  SEO Optimization"
          echo "   ✅ Step 9:  YouTube Upload"
          echo "   ✅ Step 10: Analytics & Learning"
          echo ""
          echo "📹 OUTPUT FILES:"
          echo ""
          echo "Videos:"
          ls -lh output/videos/*.mp4 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}' || echo "   No videos yet"
          echo ""
          echo "Thumbnails:"
          ls -lh output/thumbnails/*.jpg 2>/dev/null | awk '{print "   " $9}' || echo "   No thumbnails"
          echo ""
          echo "📊 File Statistics:"
          echo "   Total files: $(find output/ -type f 2>/dev/null | wc -l)"
          echo "   Total size: $(du -sh output/ 2>/dev/null | cut -f1)"
          echo ""
          echo "🚀 NEXT STEPS:"
          echo "   1. Check GitHub → output/videos/ folder"
          echo "   2. Download MP4 files"
          echo "   3. Upload to YouTube"
          echo ""
          echo "⏰ AUTOMATION:"
          echo "   Scheduled run: Daily at 2:00 AM UTC"
          echo "   Next run: Tomorrow at 2:00 AM UTC"
          echo "   Manual trigger: Anytime via Actions tab"
          echo ""
          echo "✨ Your automated YouTube channel is operational!"
          echo ""
